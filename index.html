<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kumidaico Techno</title>

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Rajdhani', sans-serif;
    background: #000 url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
    color: #fff;
    text-align: center;
}

header {
    padding: 80px 20px;
    background: linear-gradient(black, #0a0a0a);
}

h1 {
    font-size: 48px;
    letter-spacing: 8px;
    text-shadow: 0 0 12px rgba(0,255,204,0.3);
}

nav {
    margin: 50px 0;
}

nav button {
    background: transparent;
    color: #aaa;
    border: 1px solid #444;
    padding: 14px 28px;
    margin: 6px;
    letter-spacing: 3px;
    font-weight: 600;
    transition: 0.3s;
    font-size: 14px;
}

nav button:hover {
    background: #111;
    border: 1px solid #00ffcc;
    color: #00ffcc;
}

.section {
    display: none;
    padding: 60px 20px;
    max-width: 900px;
    margin: auto;
    border-top: 1px solid #222;
}

img {
    width: 90%;
    max-width: 600px;
    margin: 40px auto;
    display: block;
    border-radius: 6px;
    box-shadow: 0 0 25px #000;
    opacity: 0.9;
}

a {
    color: #00ffcc;
    text-decoration: none;
    transition: 0.3s;
}

a:hover {
    color: #ffffff;
}

h2 {
    margin-bottom: 40px;
    letter-spacing: 4px;
}

h3 {
    margin-top: 40px;
    color: #777;
    letter-spacing: 2px;
}

footer {
    padding: 80px 20px;
    background: #0a0a0a;
    margin-top: 80px;
    font-size: 15px;
}

/* Instagram estilo industrial */

.instagram-link {
    display: inline-block;
    margin-top: 20px;
    letter-spacing: 3px;
    font-size: 14px;
    color: #00ffcc;
    border-bottom: 1px solid #222;
    padding-bottom: 5px;
    transition: 0.3s;
}

.instagram-link:hover {
    color: #fff;
    border-bottom: 1px solid #00ffcc;
}
