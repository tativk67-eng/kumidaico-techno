<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>KUMIDAICO</title>

<style>

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: url('file_00000000698471f891ad9e52514c0248.png') no-repeat center center fixed;
  background-size: cover;
  color: white;
  text-align: center;
}

.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding-bottom: 40px;
}

.logo img {
  width: 250px;
  margin-top: 30px;
}

h1 {
  font-size: 60px;
  letter-spacing: 10px;
  margin: 10px 0 30px 0;
}

.dj-list {
  width: 90%;
  max-width: 600px;
  margin: auto;
}

.dj {
  margin: 12px 0;
  padding: 15px;
  background: rgba(255,255,255,0.1);
  cursor: pointer;
  transition: 0.3s;
  border-radius: 8px;
}

.dj:hover {
  background: crimson;
}

.music {
  display: none;
  margin-top: 10px;
}

iframe {
  width: 100%;
  height: 120px;
  border-radius: 8px;
}

</style>
</head>

<body>

<div class="overlay">

<script>
function toggleMusic(id) {
  var element = document.getElementById(id);
  if (element.style.display === "block") {
    element.style.display = "none";
  } else {
    element.style.display = "block";
  }
}
</script>
